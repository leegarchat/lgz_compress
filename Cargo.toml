[package]
name = "lgz_compress"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "lgz_compress — low-level standalone binary compression utility, arm64-oriented static musl builds"
repository = "https://github.com/anomalyco/opencode"

[[bin]]
name = "lgz_compress"
path = "src/main.rs"

[dependencies]
libc = "0.2"
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "optimization"] }
rayon = { version = "1.10", optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[features]
default = ["compress"]
compress = ["dep:rayon", "lzma-rust2/encoder"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
